[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "thelab-langchain"
version = "0.1.0"
description = "LangChain + Supermemory integration demo using Grok (xAI) or Anthropic"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Derek Clair", email = "derek@derekclair.com"}
]
keywords = ["langchain", "supermemory", "grok", "xai", "anthropic", "memory", "ai", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langchain>=0.3.0",
    "langchain-xai>=0.1.0",
    "langchain-openai>=0.2.0",
    "langgraph>=0.2.0",
    "supermemory>=0.1.0",
    "nvidia-riva-client>=2.0.0",
    "sounddevice>=0.4.6",
    "numpy>=1.26.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]
anthropic = [
    "langchain-anthropic>=0.3.0",
]

[project.scripts]
thelab-chat = "thelab_langchain.cli:app"
thelab-bench = "benchmarks.runner:app"

[project.urls]
Homepage = "https://github.com/derekclair/thelab"
Documentation = "https://supermemory.ai/docs/integrations/langchain"
Issues = "https://github.com/derekclair/thelab/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/thelab_langchain"]

[tool.ruff]
line-length = 100
target-version = "py311"
# `examples/` and `benchmarks/` are standalone illustrative scripts, not part of
# the importable library or the test surface, so they are excluded from linting.
extend-exclude = ["examples", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
